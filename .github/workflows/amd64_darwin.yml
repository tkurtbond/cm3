---
name: AMD64_DARWIN

on:
  workflow_call:
    inputs:
      os:
        default: macos-15-intel
        required: false
        type: string
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_DARWIN-d5.12.0.tar.xz
        required: false
        type: string

jobs:
  build-and-test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 80

    strategy:
      fail-fast: false
      matrix:
        backend: [c]

    env:
      CM3_TARGET: AMD64_DARWIN

    steps:
    # This fork: Homebrew no longer has bottles for Intel macOS and
    # built libxaw, libxft and ninja from source, past the job's
    # timeout.  XQuartz is a cask (prebuilt) and has all the X11
    # libraries the AMD64_DARWIN config links from /opt/X11/lib;
    # ninja comes from its release.
    - name: Install prerequisites
      run: |
        brew install --cask xquartz
        mkdir -p ../tools/bin
        curl --location --silent --fail -o ../ninja-mac.zip \
          https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip
        unzip -q ../ninja-mac.zip -d ../tools/bin
        echo "$(cd ../tools/bin && pwd)" >> $GITHUB_PATH

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${{ inputs.release }}/${{ inputs.bootstrap }}" | gtar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v4

    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend "${{ matrix.backend }}" all -caltech-other -caltech-parser -m3-scheme

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v2
      with:
        name: ${{ format('m3tests ({0}, {1})', env.CM3_TARGET, matrix.backend) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit
