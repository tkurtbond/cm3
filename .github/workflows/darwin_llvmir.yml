---
name: DARWIN_LLVMIR
# This fork's LLVM IR back end (M3_BACKEND_MODE = "LlvmIR") on macOS
# (PLAN.md, Phase 7): build everything with it and run the compiler
# tests.  ARM64_DARWIN with the oldest supported LLVM (18) and the
# newest; AMD64_DARWIN (Intel runners) with the newest LLVM release that
# has Intel macOS binaries.  LLVM doesn't come from Xcode: Apple's clang
# has its own version numbers and lags LLVM.  On ARM64 it comes from
# Homebrew; on Intel, Homebrew no longer has bottles and builds from
# source (past the job's timeout), so it comes from LLVM's releases.
# The "headless" package set needs no X11 libraries.  The Darwin configs turn on zero-cost exceptions (ex_stack),
# so this also tests LlvmIR's ex_stack support there.
# Based on amd64_darwin.yml, arm64_darwin.yml and amd64_linux_llvmir.yml.

on:
  workflow_call:
    inputs:
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
        - target: ARM64_DARWIN
          os: macos-latest
          llvm: 18
        - target: ARM64_DARWIN
          os: macos-latest
          llvm: 22
        # 20.1.7 is the newest LLVM release with an Intel macOS build.
        - target: AMD64_DARWIN
          os: macos-15-intel
          llvm: 20
          llvm_release: 20.1.7

    env:
      CM3_TARGET: ${{ matrix.target }}
      # Unix.common's compile_llvm_ir checks every .ll with llvm-as
      # (LLVM's IR verifier) before compiling it.
      M3_LLVM_IR_VERIFY: 1
      # m3tests that fail with the C back end too.  On macOS, besides
      # p047: the shell reports signals as "Abort trap: 6" and
      # "Segmentation fault: 11", not "Aborted" and "Segmentation fault"
      # (e020, r001 to r005), and p223's expected output names Linux
      # shared libraries (.so, not .dylib).
      KNOWN_FAILURES: p047 e020 p223 r001 r002 r003 r004 r005
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: cm3-boot-${{ matrix.target }}-d5.12.0.tar.xz

    steps:
    - name: Install prerequisites (Homebrew)
      if: ${{ !matrix.llvm_release }}
      run: |
        brew update
        brew install ninja llvm@${{ matrix.llvm }}
        # Keg-only: put this LLVM's clang and llvm-as first on PATH.
        echo "$(brew --prefix llvm@${{ matrix.llvm }})/bin" >> $GITHUB_PATH

    - name: Install prerequisites (release binaries)
      if: ${{ matrix.llvm_release }}
      run: |
        mkdir -p ../tools/bin ../llvm
        curl --location --silent --fail \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.llvm_release }}/LLVM-${{ matrix.llvm_release }}-macOS-X64.tar.xz" \
          | gtar Jxf - --directory=../llvm --strip-components=1
        curl --location --silent --fail -o ../ninja-mac.zip \
          https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip
        unzip -q ../ninja-mac.zip -d ../tools/bin
        echo "$(cd ../llvm/bin && pwd)" >> $GITHUB_PATH
        echo "$(cd ../tools/bin && pwd)" >> $GITHUB_PATH
        # LLVM's own clang, unlike Homebrew's, isn't set up to find
        # the macOS SDK.
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

    - name: Show LLVM
      run: |
        which clang llvm-as
        clang --version

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${RELEASE}/${BOOTSTRAP}" | gtar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    # "--backend llvmir" builds the compiler with the C back end once,
    # then rebuilds it twice with LlvmIR, and makes LlvmIR the default
    # in the installed cm3.cfg; everything after that uses LlvmIR.
    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend llvmir -g0 headless -m3gdb

    - name: Check the default back end
      run: |
        cm3 -version
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, llvmir, LLVM {1})', env.CM3_TARGET, matrix.llvm) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()      # test ids, e.g. "p047" of "p047: Real - Integer LOOPHOLE"
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        EOF
