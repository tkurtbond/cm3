---
name: AMD64_LINUX_LLVMIR
# This fork's LLVM IR back end (M3_BACKEND_MODE = "LlvmIR"; PLAN.md,
# Phase 6): build everything with it and run the compiler tests, once
# with the oldest supported LLVM (18) and once with the newest, and once
# more with the newest and zero-cost exceptions (ex_stack, PLAN.md
# Phase 7), which the AMD64_LINUX config leaves off by default, and
# once more with everything (compiler, libraries and tests) optimized:
# bugs that show up only under optimization usually mean undefined
# behavior in the emitted IR.
# The job ir-bootstrap makes a bootstrap of LLVM IR ("concierge.py
# make-bootstrap --backend llvmir"), builds it with clang, and builds
# and tests everything with the compiler it gives, without "--backend
# llvmir": the bootstrap makes LlvmIR concierge's default.
# Based on amd64_linux.yml.

on:
  workflow_call:
    inputs:
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_LINUX-d5.12.0.tar.xz
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.optimize && 90 || 60 }}

    strategy:
      fail-fast: false
      matrix:
        # apt.llvm.org has no LLVM 18 for the newest Ubuntu, so LLVM 18
        # runs on 24.04, whose own archive has it.
        include:
        - llvm: 18
          os: ubuntu-24.04
        - llvm: 22
          os: ubuntu-latest
        - llvm: 22
          os: ubuntu-latest
          exceptions: ex_stack
        # "cm3 -O2": clang -O2 on every unit.
        - llvm: 22
          os: ubuntu-latest
          optimize: true

    env:
      CM3_TARGET: AMD64_LINUX
      # Unix.common's compile_llvm_ir checks every .ll with llvm-as
      # (LLVM's IR verifier) before compiling it.
      M3_LLVM_IR_VERIFY: 1
      # m3tests that fail with the C back end too.  e041: the front end
      # crashes (with either back end) on its mutually recursive
      # REVEALs; under dash, the shell's "Segmentation fault" lands in
      # the captured stderr, so it fails on Ubuntu (not under bash).
      KNOWN_FAILURES: p047 e041
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: ${{ inputs.bootstrap || 'cm3-boot-AMD64_LINUX-d5.12.0.tar.xz' }}

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes libglu1-mesa-dev ninja-build xorg-dev binutils-gold libunwind-dev lsb-release wget software-properties-common gnupg

    - name: Install LLVM ${{ matrix.llvm }}
      run: |
        # The distribution's packages if it has them, else apt.llvm.org.
        if apt-cache show clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }} > /dev/null 2>&1; then
          sudo apt-get install --quiet --assume-yes clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }}
        else
          wget --quiet https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
        fi
        # FileCheck, for m3-sys/m3llvmir/tests.
        sudo apt-get install --quiet --assume-yes llvm-${{ matrix.llvm }}-tools
        echo "/usr/lib/llvm-${{ matrix.llvm }}/bin" >> $GITHUB_PATH

    - name: Show LLVM
      run: |
        which clang llvm-as
        clang --version

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${RELEASE}/${BOOTSTRAP}" | tar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    # The installed config is copied from the source tree, so this turns
    # ex_stack on for the whole build and for m3tests.
    - name: Turn on ex_stack
      if: ${{ matrix.exceptions == 'ex_stack' }}
      run: |
        sed -i 's/^%M3_USE_STACK_WALKER = TRUE/M3_USE_STACK_WALKER = TRUE/' m3-sys/cminstall/src/config/AMD64_LINUX
        grep -n '^M3_USE_STACK_WALKER = TRUE' m3-sys/cminstall/src/config/AMD64_LINUX

    # "--backend llvmir" builds the compiler with the C back end once,
    # then rebuilds it twice with LlvmIR, and makes LlvmIR the default
    # in the installed cm3.cfg; everything after that uses LlvmIR.
    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend llvmir -g0 ${{ matrix.optimize && '-O2' || '' }} all -caltech-other -caltech-parser -m3-scheme

    - name: Check the default back end
      run: |
        cm3 -version
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"
        if [ "${{ matrix.exceptions }}" = ex_stack ]; then
          grep -n '^M3_USE_STACK_WALKER = TRUE' "${CM3_INSTALL}/bin/config/AMD64_LINUX"
          # m3core was built with ex_stack's runtime (RTExStack), not
          # ex_frame's.
          nm "${CM3_INSTALL}/lib/libm3core.a" | grep -q 'RTStack__ThrowM3Exc'
        fi

    # Mixed C/LlvmIR linking and FileCheck checks on the IR.
    - name: Run LlvmIR's own tests
      run: |
        m3-sys/m3llvmir/tests/run-tests.sh ${{ matrix.optimize && '-O' || '' }} "${RUNNER_TEMP}/m3llvmir-tests"

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML ${{ matrix.optimize && '-DM3TESTS_OPTIMIZE' || '' }}
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, llvmir, LLVM {1}{2}{3})', env.CM3_TARGET, matrix.llvm, matrix.exceptions && ', ex_stack' || '', matrix.optimize && ', -O2' || '') }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()      # test ids, e.g. "p047" of "p047: Real - Integer LOOPHOLE"
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        EOF

  # A bootstrap of LLVM IR instead of C (m3-sys/m3llvmir/README.md, "A
  # bootstrap of LLVM IR").
  ir-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CM3_TARGET: AMD64_LINUX
      M3_LLVM_IR_VERIFY: 1
      KNOWN_FAILURES: p047 e041
      LLVM: 22
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: ${{ inputs.bootstrap || 'cm3-boot-AMD64_LINUX-d5.12.0.tar.xz' }}

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes libglu1-mesa-dev ninja-build xorg-dev binutils-gold libunwind-dev lsb-release wget software-properties-common gnupg

    - name: Install LLVM
      run: |
        if apt-cache show clang-${LLVM} llvm-${LLVM} > /dev/null 2>&1; then
          sudo apt-get install --quiet --assume-yes clang-${LLVM} llvm-${LLVM}
        else
          wget --quiet https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${LLVM}
        fi
        sudo apt-get install --quiet --assume-yes llvm-${LLVM}-tools
        echo "/usr/lib/llvm-${LLVM}/bin" >> $GITHUB_PATH

    - name: Define install locations
      run: |
        # C_INSTALL: the C bootstrap release, upgraded from this tree,
        # which makes the IR bootstrap.  CM3_INSTALL: the IR bootstrap
        # and everything built from it.
        echo C_INSTALL="$(pwd)/../c-install" >> $GITHUB_ENV
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install C bootstrap release
      run: |
        mkdir ../c-bootstrap ../c-build
        curl --location --silent --show-error --fail "${RELEASE}/${BOOTSTRAP}" | tar Jxf - --directory=../c-bootstrap --strip-components=1
        cmake -S ../c-bootstrap -B ../c-build -G Ninja -DCMAKE_INSTALL_PREFIX="${C_INSTALL}"
        cmake --build ../c-build
        cmake --install ../c-build

    - name: Fetch sources
      uses: actions/checkout@v6

    # The release's compiler has no LlvmIR back end: upgrade it (with
    # C) to this tree's compiler first.  concierge installs into
    # CM3_INSTALL when it is set, in preference to the cm3 on PATH.
    - name: Make the IR bootstrap
      run: |
        export PATH="${C_INSTALL}/bin:$PATH" CM3_INSTALL="${C_INSTALL}"
        scripts/concierge.py upgrade -g0
        mkdir ../tarball
        cd ../tarball
        "${GITHUB_WORKSPACE}/scripts/concierge.py" make-bootstrap --backend llvmir
        ls -l
        tar Jtf cm3-boot-${CM3_TARGET}-llvmir-*.tar.xz | grep -c '\.ll$'
        rm -rf "${GITHUB_WORKSPACE}/bootstrap"

    - name: Upload the IR bootstrap
      uses: actions/upload-artifact@v4
      with:
        name: cm3-boot-AMD64_LINUX-llvmir
        path: ../tarball/cm3-boot-*.tar.xz

    - name: Build the IR bootstrap
      run: |
        mkdir ../bootstrap
        tar Jxf ../tarball/cm3-boot-${CM3_TARGET}-llvmir-*.tar.xz --directory=../bootstrap --strip-components=1
        # It must refuse a C compiler other than clang.
        if CC=gcc CXX=g++ cmake -S ../bootstrap -B ../gcc-build -G Ninja > ../gcc-build.log 2>&1; then
          cat ../gcc-build.log
          echo "the IR bootstrap accepted gcc"
          exit 1
        fi
        grep 'needs clang' ../gcc-build.log
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Build everything with the IR bootstrap's compiler
      run: |
        cm3 -version
        cat "${CM3_INSTALL}/share/cm3/bootstrap-backend"
        scripts/concierge.py full-upgrade -g0
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"

    - name: Run LlvmIR's own tests
      run: |
        m3-sys/m3llvmir/tests/run-tests.sh "${RUNNER_TEMP}/m3llvmir-tests"

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        EOF
