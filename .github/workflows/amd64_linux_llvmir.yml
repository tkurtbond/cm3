---
name: AMD64_LINUX_LLVMIR
# This fork's LLVM IR back end (M3_BACKEND_MODE = "LlvmIR"; PLAN.md,
# Phase 6): build everything with it and run the compiler tests, once
# with the oldest supported LLVM (18) and once with the newest.
# Based on amd64_linux.yml.

on:
  workflow_call:
    inputs:
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_LINUX-d5.12.0.tar.xz
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # apt.llvm.org has no LLVM 18 for the newest Ubuntu, so LLVM 18
        # runs on 24.04, whose own archive has it.
        include:
        - llvm: 18
          os: ubuntu-24.04
        - llvm: 22
          os: ubuntu-latest

    env:
      CM3_TARGET: AMD64_LINUX
      # Unix.common's compile_llvm_ir checks every .ll with llvm-as
      # (LLVM's IR verifier) before compiling it.
      M3_LLVM_IR_VERIFY: 1
      # m3tests that fail with the C back end too.
      KNOWN_FAILURES: p047
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: ${{ inputs.bootstrap || 'cm3-boot-AMD64_LINUX-d5.12.0.tar.xz' }}

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes libglu1-mesa-dev ninja-build xorg-dev binutils-gold lsb-release wget software-properties-common gnupg

    - name: Install LLVM ${{ matrix.llvm }}
      run: |
        # The distribution's packages if it has them, else apt.llvm.org.
        if apt-cache show clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }} > /dev/null 2>&1; then
          sudo apt-get install --quiet --assume-yes clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }}
        else
          wget --quiet https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
        fi
        echo "/usr/lib/llvm-${{ matrix.llvm }}/bin" >> $GITHUB_PATH

    - name: Show LLVM
      run: |
        which clang llvm-as
        clang --version

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${RELEASE}/${BOOTSTRAP}" | tar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    # "--backend llvmir" builds the compiler with the C back end once,
    # then rebuilds it twice with LlvmIR, and makes LlvmIR the default
    # in the installed cm3.cfg; everything after that uses LlvmIR.
    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend llvmir -g0 all -caltech-other -caltech-parser -m3-scheme

    - name: Check the default back end
      run: |
        cm3 -version
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, llvmir, LLVM {1})', env.CM3_TARGET, matrix.llvm) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()      # test ids, e.g. "p047" of "p047: Real - Integer LOOPHOLE"
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        EOF
