---
name: integration
# Build and test starting from latest bootstrap release.

on:
  pull_request: {branches: master}
  # This fork: full CI only on master (work happens on dev, which is
  # fast-forwarded into master); run it on another branch by hand with
  # "gh workflow run integration --ref dev".
  push: {branches: master}
  workflow_dispatch:

concurrency: ci

jobs:
  AMD64_DARWIN:
    uses: modula3/cm3/.github/workflows/amd64_darwin.yml@master

  ARM64_DARWIN:
    uses: modula3/cm3/.github/workflows/arm64_darwin.yml@master

  AMD64_LINUX:
    uses: modula3/cm3/.github/workflows/amd64_linux.yml@master

  # This fork: the LlvmIR back end, with LLVM 18 and the newest LLVM.
  AMD64_LINUX_LLVMIR:
    uses: ./.github/workflows/amd64_linux_llvmir.yml

  ARM64_LINUX_LLVMIR:
    uses: ./.github/workflows/arm64_linux_llvmir.yml

  DARWIN_LLVMIR:
    uses: ./.github/workflows/darwin_llvmir.yml

  AMD64_MINGW:
    uses: modula3/cm3/.github/workflows/amd64_mingw.yml@master

  AMD64_NT:
    uses: modula3/cm3/.github/workflows/amd64_nt.yml@master

  I386_LINUX:
    uses: modula3/cm3/.github/workflows/i386_linux.yml@master

  I386_NT:
    uses: modula3/cm3/.github/workflows/i386_nt.yml@master
