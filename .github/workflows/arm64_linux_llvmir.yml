---
name: ARM64_LINUX_LLVMIR
# This fork's LLVM IR back end (M3_BACKEND_MODE = "LlvmIR") on
# ARM64_LINUX (PLAN.md, Phase 7): build everything with it and run the
# compiler tests, with the oldest supported LLVM (18) and the newest,
# and once more with the newest and zero-cost exceptions (ex_stack),
# which the ARM64_LINUX config leaves off by default.
# Based on amd64_linux_llvmir.yml.
#
# There is no ARM64_LINUX bootstrap release, so the first job makes one
# on x86 the way make-release.yml makes its cross distributions: install
# the AMD64_LINUX bootstrap, upgrade to this tree's compiler, and run
# "concierge.py make-bootstrap --target ARM64_LINUX" (C++ sources plus
# CMake files, built on the ARM runner by the second job).

on:
  workflow_call:
    inputs:
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_LINUX-d5.12.0.tar.xz
        required: false
        type: string
  workflow_dispatch:

jobs:
  make-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: ${{ inputs.bootstrap || 'cm3-boot-AMD64_LINUX-d5.12.0.tar.xz' }}

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes ninja-build binutils-gold

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install AMD64_LINUX bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${RELEASE}/${BOOTSTRAP}" | tar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    - name: Upgrade compiler
      run: |
        scripts/concierge.py upgrade

    - name: Make ARM64_LINUX bootstrap
      run: |
        scripts/concierge.py make-bootstrap --target ARM64_LINUX
        ls -l cm3-boot-ARM64_LINUX-*.tar.xz

    - name: Upload bootstrap
      uses: actions/upload-artifact@v4
      with:
        name: cm3-boot-ARM64_LINUX
        path: cm3-boot-ARM64_LINUX-*.tar.xz
        retention-days: 7

  build-and-test:
    needs: make-bootstrap
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
        - llvm: 18
        - llvm: 22
        - llvm: 22
          exceptions: ex_stack

    env:
      CM3_TARGET: ARM64_LINUX
      # Unix.common's compile_llvm_ir checks every .ll with llvm-as
      # (LLVM's IR verifier) before compiling it.
      M3_LLVM_IR_VERIFY: 1
      # m3tests that fail with the C back end too (see
      # amd64_linux_llvmir.yml).
      KNOWN_FAILURES: p047 e041

    steps:
    - name: Install prerequisites
      run: |
        sudo apt-get update --quiet
        sudo apt-get install --quiet --assume-yes libglu1-mesa-dev ninja-build xorg-dev binutils-gold libunwind-dev lsb-release wget software-properties-common gnupg

    - name: Install LLVM ${{ matrix.llvm }}
      run: |
        # The distribution's packages if it has them, else apt.llvm.org.
        if apt-cache show clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }} > /dev/null 2>&1; then
          sudo apt-get install --quiet --assume-yes clang-${{ matrix.llvm }} llvm-${{ matrix.llvm }}
        else
          wget --quiet https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh ${{ matrix.llvm }}
        fi
        echo "/usr/lib/llvm-${{ matrix.llvm }}/bin" >> $GITHUB_PATH

    - name: Show LLVM
      run: |
        which clang llvm-as
        clang --version

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Download ARM64_LINUX bootstrap
      uses: actions/download-artifact@v4
      with:
        name: cm3-boot-ARM64_LINUX
        path: ../boot-archive

    - name: Install ARM64_LINUX bootstrap
      run: |
        mkdir ../bootstrap ../build
        tar Jxf ../boot-archive/cm3-boot-ARM64_LINUX-*.tar.xz --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    # The installed config is copied from the source tree, so this turns
    # ex_stack on for the whole build and for m3tests.  (The bootstrap,
    # made by the first job, uses ex_frame.)
    - name: Turn on ex_stack
      if: ${{ matrix.exceptions == 'ex_stack' }}
      run: |
        sed -i 's/^%M3_USE_STACK_WALKER = TRUE/M3_USE_STACK_WALKER = TRUE/' m3-sys/cminstall/src/config/ARM64_LINUX
        grep -n '^M3_USE_STACK_WALKER = TRUE' m3-sys/cminstall/src/config/ARM64_LINUX

    # "--backend llvmir" builds the compiler with the C back end once,
    # then rebuilds it twice with LlvmIR, and makes LlvmIR the default
    # in the installed cm3.cfg; everything after that uses LlvmIR.
    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend llvmir -g0 all -caltech-other -caltech-parser -m3-scheme

    - name: Check the default back end
      run: |
        cm3 -version
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"
        if [ "${{ matrix.exceptions }}" = ex_stack ]; then
          grep -n '^M3_USE_STACK_WALKER = TRUE' "${CM3_INSTALL}/bin/config/ARM64_LINUX"
          # m3core was built with ex_stack's runtime (RTExStack), not
          # ex_frame's.
          nm "${CM3_INSTALL}/lib/libm3core.a" | grep -q 'RTStack__ThrowM3Exc'
        fi

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, llvmir, LLVM {1}{2})', env.CM3_TARGET, matrix.llvm, matrix.exceptions && ', ex_stack' || '') }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()      # test ids, e.g. "p047" of "p047: Real - Integer LOOPHOLE"
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        EOF
