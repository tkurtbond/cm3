---
name: DARWIN_LLVMIR
# This fork's LLVM IR back end (M3_BACKEND_MODE = "LlvmIR") on macOS
# (PLAN.md, Phase 7): build everything with it and run the compiler
# tests.  ARM64_DARWIN with the oldest supported LLVM (18) and the
# newest; AMD64_DARWIN (Intel runners) with the newest LLVM release that
# has Intel macOS binaries.  LLVM doesn't come from Xcode: Apple's clang
# has its own version numbers and lags LLVM.  On ARM64 it comes from
# Homebrew; on Intel, Homebrew no longer has bottles and builds from
# source (past the job's timeout), so it comes from LLVM's releases.
# The "headless" package set needs no X11 libraries.  The Darwin configs turn on zero-cost exceptions (ex_stack),
# so this also tests LlvmIR's ex_stack support there.
# The ir-bootstrap job makes bootstraps of LLVM IR for ARM64_DARWIN and
# AMD64_DARWIN ("concierge.py make-bootstrap --backend llvmir"), builds
# them with clang, and builds and tests everything from them.
# Based on amd64_darwin.yml, arm64_darwin.yml and amd64_linux_llvmir.yml.

on:
  workflow_call:
    inputs:
      release:
        default: https://github.com/modula3/cm3/releases/download/d5.12.0
        required: false
        type: string
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
        - target: ARM64_DARWIN
          os: macos-latest
          llvm: 18
        - target: ARM64_DARWIN
          os: macos-latest
          llvm: 22
        # 20.1.7 is the newest LLVM release with an Intel macOS build.
        - target: AMD64_DARWIN
          os: macos-15-intel
          llvm: 20
          llvm_release: 20.1.7

    env:
      CM3_TARGET: ${{ matrix.target }}
      # Unix.common's compile_llvm_ir checks every .ll with llvm-as
      # (LLVM's IR verifier) before compiling it.
      M3_LLVM_IR_VERIFY: 1
      # m3tests that fail with the C back end too.  On macOS, besides
      # p047: the shell reports signals as "Abort trap: 6" and
      # "Segmentation fault: 11", not "Aborted" and "Segmentation fault"
      # (e020, r001 to r005), and p223's expected output names Linux
      # shared libraries (.so, not .dylib).
      KNOWN_FAILURES: p047 e020 p223 r001 r002 r003 r004 r005
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: cm3-boot-${{ matrix.target }}-d5.12.0.tar.xz

    steps:
    - name: Install prerequisites (Homebrew)
      if: ${{ !matrix.llvm_release }}
      run: |
        brew update
        brew install ninja llvm@${{ matrix.llvm }}
        # Keg-only: put this LLVM's clang and llvm-as first on PATH.
        echo "$(brew --prefix llvm@${{ matrix.llvm }})/bin" >> $GITHUB_PATH

    - name: Install prerequisites (release binaries)
      if: ${{ matrix.llvm_release }}
      run: |
        mkdir -p ../tools/bin ../llvm
        curl --location --silent --fail \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.llvm_release }}/LLVM-${{ matrix.llvm_release }}-macOS-X64.tar.xz" \
          | gtar Jxf - --directory=../llvm --strip-components=1
        curl --location --silent --fail -o ../ninja-mac.zip \
          https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip
        unzip -q ../ninja-mac.zip -d ../tools/bin
        echo "$(cd ../llvm/bin && pwd)" >> $GITHUB_PATH
        echo "$(cd ../tools/bin && pwd)" >> $GITHUB_PATH
        # LLVM's own clang, unlike Homebrew's, isn't set up to find
        # the macOS SDK.
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

    - name: Show LLVM
      run: |
        which clang llvm-as
        clang --version

    - name: Define install location
      run: |
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${RELEASE}/${BOOTSTRAP}" | gtar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    # "--backend llvmir" builds the compiler with the C back end once,
    # then rebuilds it twice with LlvmIR, and makes LlvmIR the default
    # in the installed cm3.cfg; everything after that uses LlvmIR.
    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend llvmir -g0 headless -m3gdb

    - name: Check the default back end
      run: |
        cm3 -version
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, llvmir, LLVM {1})', env.CM3_TARGET, matrix.llvm) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'EOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()      # test ids, e.g. "p047" of "p047: Real - Integer LOOPHOLE"
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        EOF

  # Bootstraps of LLVM IR for ARM64_DARWIN and AMD64_DARWIN, as
  # make-release.yml makes them: upgrade the C bootstrap release to this
  # tree's compiler, make the IR bootstrap with it, build that with
  # clang, and then build everything with its compiler.  The bootstrap
  # installs a marker (share/cm3/bootstrap-backend) that makes concierge
  # default to LlvmIR, so full-upgrade runs without "--backend llvmir".
  # LLVM comes from Homebrew on ARM64 and from LLVM's releases on Intel,
  # as in build-and-test.  See README-macOS.md.
  ir-bootstrap:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
        - target: ARM64_DARWIN
          os: macos-latest
          llvm: 22
          triple: arm64-apple-macosx
        - target: AMD64_DARWIN
          os: macos-15-intel
          llvm: 20
          llvm_release: 20.1.7
          triple: x86_64-apple-macosx

    env:
      CM3_TARGET: ${{ matrix.target }}
      M3_LLVM_IR_VERIFY: 1
      KNOWN_FAILURES: p047 e020 p223 r001 r002 r003 r004 r005
      RELEASE: ${{ inputs.release || 'https://github.com/modula3/cm3/releases/download/d5.12.0' }}
      BOOTSTRAP: cm3-boot-${{ matrix.target }}-d5.12.0.tar.xz

    steps:
    - name: Install prerequisites (Homebrew)
      if: ${{ !matrix.llvm_release }}
      run: |
        brew update
        brew install ninja llvm@${{ matrix.llvm }}
        echo "$(brew --prefix llvm@${{ matrix.llvm }})/bin" >> $GITHUB_PATH

    - name: Install prerequisites (release binaries)
      if: ${{ matrix.llvm_release }}
      run: |
        mkdir -p ../tools/bin ../llvm
        curl --location --silent --fail --retry 3 \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ matrix.llvm_release }}/LLVM-${{ matrix.llvm_release }}-macOS-X64.tar.xz" \
          | gtar Jxf - --directory=../llvm --strip-components=1
        curl --location --silent --fail --retry 3 -o ../ninja-mac.zip \
          https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-mac.zip
        unzip -q ../ninja-mac.zip -d ../tools/bin
        echo "$(cd ../llvm/bin && pwd)" >> $GITHUB_PATH
        echo "$(cd ../tools/bin && pwd)" >> $GITHUB_PATH
        # LLVM's own clang, unlike Homebrew's, isn't set up to find
        # the macOS SDK.
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

    - name: Show LLVM
      run: |
        which clang llvm-as
        clang --version

    - name: Define install locations
      run: |
        # C_INSTALL: the C bootstrap release, upgraded from this tree,
        # which makes the IR bootstrap.  CM3_INSTALL: the IR bootstrap
        # and everything built from it.
        echo C_INSTALL="$(pwd)/../c-install" >> $GITHUB_ENV
        echo CM3_INSTALL="$(pwd)/../install" >> $GITHUB_ENV

    - name: Install C bootstrap release
      run: |
        mkdir ../c-bootstrap ../c-build
        curl --location --silent --show-error --fail --retry 3 "${RELEASE}/${BOOTSTRAP}" | gtar Jxf - --directory=../c-bootstrap --strip-components=1
        cmake -S ../c-bootstrap -B ../c-build -G Ninja -DCMAKE_INSTALL_PREFIX="${C_INSTALL}"
        cmake --build ../c-build
        cmake --install ../c-build

    - name: Fetch sources
      uses: actions/checkout@v6

    # The release's compiler has no LlvmIR back end: upgrade it (with
    # C) to this tree's compiler first.  concierge installs into
    # CM3_INSTALL when it is set, in preference to the cm3 on PATH.
    - name: Make the IR bootstrap
      run: |
        export PATH="${C_INSTALL}/bin:$PATH" CM3_INSTALL="${C_INSTALL}"
        scripts/concierge.py upgrade -g0
        mkdir ${{ runner.temp }}/tarball
        cd ${{ runner.temp }}/tarball
        "${GITHUB_WORKSPACE}/scripts/concierge.py" make-bootstrap --backend llvmir
        ls -l
        gtar Jtf cm3-boot-${CM3_TARGET}-llvmir-*.tar.xz | grep -c '\.ll$'
        gtar Jxf cm3-boot-${CM3_TARGET}-llvmir-*.tar.xz --wildcards --to-stdout '*/m3core/RTHooks.m3.ll' | grep '^target triple = "${{ matrix.triple }}'
        rm -rf "${GITHUB_WORKSPACE}/bootstrap"

    - name: Upload the IR bootstrap
      uses: actions/upload-artifact@v4
      with:
        name: cm3-boot-${{ matrix.target }}-llvmir
        path: ${{ runner.temp }}/tarball/cm3-boot-*.tar.xz
        retention-days: 7

    - name: Build the IR bootstrap
      run: |
        mkdir ../bootstrap
        gtar Jxf ${{ runner.temp }}/tarball/cm3-boot-${CM3_TARGET}-llvmir-*.tar.xz --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Build everything with the IR bootstrap's compiler
      run: |
        cm3 -version
        cat "${CM3_INSTALL}/share/cm3/bootstrap-backend"
        scripts/concierge.py full-upgrade -g0 headless -m3gdb
        grep -n 'M3_BACKEND_MODE = "LlvmIR"' "${CM3_INSTALL}/bin/cm3.cfg"

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, llvmir, LLVM {1}, IR bootstrap)', matrix.target, matrix.llvm) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Fail on unexpected test failures
      run: |
        python3 - m3-sys/m3tests/m3tests-results.xml <<'PYEOF'
        import os, sys, xml.etree.ElementTree as ET
        known = set(os.environ.get("KNOWN_FAILURES", "").split())
        failed = set()
        for case in ET.parse(sys.argv[1]).iter("testcase"):
            if case.find("failure") is not None or case.find("error") is not None:
                failed.add(case.get("name").split(":")[0].strip())
        unexpected = sorted(failed - known)
        print("failed:", " ".join(sorted(failed)) or "none")
        if unexpected:
            sys.exit("unexpected failures: " + " ".join(unexpected))
        PYEOF
